      outside the declared four values. DONE 2026-10-13: set to `trial` -- not
      a fifth value and not `deprecated`, because the leaf is live and routed
      and its staleness was already recorded in `last_verified: 2026-09-03`.
    recommendation: >
      Closed. `trial` is one of the four, so the facet is in domain; the leaf's
      own staleness signal is `last_verified`, which is a claim a reader can
      check.
    state: ratified
    surfaced_by: check
    layer: category
    column: assertion
    paths:
