  - id: 12
    criteria: >
      Generic engine code naming THIS INSTALLATION -- a machine, a disk, an
      account, or a provider we happen to use. `engine/` is meant to publish
      clean (R1k), so what does not yet is measured and declared here: a new
      occurrence fails the `instance-refs` gate, a declared one only warns.
    what: >
      Measured 2026-10-15 at P5: 37 occurrence(s) across 9 file(s). The
      provider selector took the two largest single sources out of `engine/`:
      `engine/structure/pazras.sh` (11 occurrences: the archive disk in the
      reconcile and sync loops, the off-site provider in log strings) no longer
      names either, and `engine/backup/proton-mirror.sh`, a provider adapter in
      disguise, is replaced by `engine/backup/mirror.sh` (a driver that names
      no provider) plus adapters outside the engine: the template in
      `engine/backup/remotes/example.sh`, which travels, and this install's own
      `config/backup/remotes/proton-drive.sh`, which the classification omits.
      Both old paths are DELETED from `paths:` here -- a declaration is
      two-directional, and a row left standing fails the gate it exists to
      quiet. What is left is nine files of test fixtures, this gate itself, and
      the two leaves the engine's own register already reasons about.
      Measured 2026-10-14: 58 occurrence(s) across 11 file(s).
      The pattern is no longer eight words spelled in the gate (P2): the
      identity words are read from `config/profile.yaml` and the home path from
      `pathlib.Path.home()`, so what `identity.name` spells is what is searched
      for. `engine/context/tests/test_l1.py` is in this list because of that
      change and was always an occurrence: the name stands there in the case a
      person writes it, and the old, lowercase pattern could not see it.
      The publication survey's 2026-09-12 round measured 81 in 32, before R2c
      split the packages and R2e moved the generated units to
      `config/schedule/` -- the units alone carried one apiece, from a
      double-quoted banner that expanded `$STAGING` (the survey's
      one-character-class bug, fixed in the same commit). The 2026-10-07 round
      measured 45 in the same 10 files; the counts here are the gate's own
      output, which is the measurement this register is read against.
    recommendation: >
      Extract or parameterise, in Track P's rounds. Three kinds were here and
      they are not the same, and P5 retired one of them: `proton-mirror.sh` was
      a provider adapter in disguise, and the provider is no longer named in
      the engine at all (`engine/backup/remotes/`). Second, the folder-tree
      CLI's hits were a script that moved from `$HOME/bin` to a package path;
      that script names neither now, because the path resolution moved into the
      adapter that has a reason to know it. What remains is mostly TEST
      FIXTURES that replay a
      real payload on purpose -- do not "fix" a fixture, it is the
      measurement's subject. `test_l1.py` is of that kind: the payload it
      replays is the user's own `user-identity.md`.
    state: open
    surfaced_by: instance-refs
    layer: category
    column: assertion
