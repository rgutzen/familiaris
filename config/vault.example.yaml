# vault.example.yaml -- the vault contract, GENERATED by `familiar consolidation vault --write`.
# Do not hand-edit: it is derived from engine/consolidation/posture.py, engine/lib/roots.py
# and config/knowledge/{entities,subjects}.yaml, and `vault --check` fails on drift.

version: 1

# a generated file a person edited is reported, never overwritten
on_drift: refuse

# the named homes the engine opens (engine/lib/roots.py)
homes:
  router: CONTEXT.md
  journal: memory/journal/
  knowledge: memory/knowledge/
  skills: memory/skills/
  ontology: config/knowledge/
  boundaries: config/boundaries/
  user: config/practice/user/
  conventions: config/practice/conventions/
  subagents: config/orchestration/

# reaches every session unasked; nothing machine-written may be here
always_loaded:
  - CONTEXT.md
  - config/practice/user/user-identity.md
  - config/practice/conventions/collaboration.md

# the user decides: a directive path an agent does not edit, `ROADMAP.md` flagged in the turn (CONTEXT.md)
human_owned:
  - config/boundaries/
  - config/practice/conventions/
  - config/practice/user/
  - ROADMAP.md

# the nightly pass writes frontmatter here, never prose
machine_writable:
  - memory/knowledge/
  - memory/skills/

# rewritten whole by a generator; see on_drift
generated:
  - memory/knowledge/INDEX.md
  - "memory/knowledge/**/CONTEXT.md"
  - "memory/knowledge/**/INDEX.md"
  - "memory/skills/**/CONTEXT.md"
  - "memory/skills/**/INDEX.md"
  - config/boundaries/containers.md
  - config/boundaries/directives.md
  - config/boundaries/git.md
  - memory/skills/TRIGGERS.md
  - memory/skills/USER-INVOKED.md

# which subject owns which directory (subjects.yaml)
places:
  knowledge:
    - memory/knowledge/
    - engine/knowledge/
    - config/knowledge/
  consolidation:
    - engine/consolidation/
  harness:
    - engine/harness/
  orchestration:
    - config/orchestration/
    - engine/orchestration/
    - config/relay/
    - engine/relay/
  context:
    - engine/context/
  skills:
    - memory/skills/
    - engine/skills/
  structure:
    - engine/structure/
    - config/structure/
  boundaries:
    - engine/boundaries/
    - config/boundaries/
  checks:
    - engine/checks/
  schedule:
    - engine/schedule/
    - config/schedule/
  backup:
    - engine/backup/
    - config/backup/
  host:
    - engine/host/
  practice:
    - config/practice/
  publication:
    - docs/
    - engine/publication/
