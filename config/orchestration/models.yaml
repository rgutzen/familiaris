    name: Claude Opus 5.5
    arena:
      low: ~
      medium: ~
      high: "Claude Opus 5.5 (High)"
      xhigh: ~
      max: ~
    vendor: anthropic
    kind: chat
    jurisdiction: US
    pool: quota
    context: "1000000"
    max_out: "128000"
    cost:
      in: "4"
      cache_hit: "0.20"
      out: "20"
      cache_write: "5"
      note: "batch API 50% off; 5m cache write 5; 1h cache write 8; cache-hit rate is 0.05x input; fast mode (research preview) 8 in / 40 out; the output-300k-2026-03-24 beta header raises max output to 300000"
