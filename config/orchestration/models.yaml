# Model catalogue for the Loom (track `orchestration`, decisions 15, 20, 21, 22, 25).
# One entry per model, keyed by the VENDOR's API model id, never by a pi provider id
# (decision 25). Callable models under `models:`; models worth knowing about that no
# binding may name under `candidates:`. Harness-agnostic and curated, not a mirror of
# pi's catalogue (decision 20); entries go stale after `stale_after_days` and are then
# re-checked at the sources in `sources:` (decision 20).
# UNITS: every price is USD per million tokens. `context` and `max_out` are tokens.
# `pool` is what pays: quota (a Claude subscription's quota, compared at API-equivalent
# list price, decision 24), usd (a metered key), or free (local compute).
# `benchmarks`: percent, number only; `date` is the model's release date, the page the
# figure comes from being the release announcement; `grade` follows 2026-10-12-literature.md
# (A independent, B vendor-reported with method, C vendor claim, D blog).
# `arena:` NAMES THE CHART ENTRY PER EFFORT LEVEL (items 13a, 14b). `familiar
# orchestration scout` compares this catalogue with the LM Arena Pareto chart
# (`paraplouis/llm-pareto-frontier`), whose model names are its own
# (`Claude Sonnet 5.5 (xHigh)`). The key is the only bridge between the two: a model
# without one is REPORTED by the scout and never matched by resemblance, because
# `Claude Haiku 4.5` is a different model from `claude-haiku-5-5` and a guess would
# have said it was not.
# ONE KEY PER LEVEL in `capabilities.effort`, or `default` for a model without
# levels. A level the chart does not rate is written `~`, never left out, so
# "unrated" is a statement and not a gap. The scout judges a member only at the level
# its tier runs, because effort multiplies the tokens a task costs and the chart's
# price is per token. The chart renames its rows (2026-10-20: every lowercase slug
# became a display name), so a mapped name the chart no longer holds fails
# `scout --check`. Names re-read from the chart dated 2026-10-20, on 2026-10-22.
#
# TWO RUNNERS. A vendor reports its own model; Artificial Analysis runs one uniform
# harness over almost every model here and is grade A. A name carrying `(AA)`, `AA-LCR`,
# `CritPt` or `MLCR-AA` is an AA figure (fetched 2026-10-13); everything else is the
# vendor's. One benchmark run by two organisations is TWO keys, never one merge:
# their numbers disagree (Opus 5.5 Terminal-Bench 4.0: 59.6 AA, 66.4 vendor).
# Every figure below was re-checked at its vendor page on 2026-10-13.
stale_after_days: "60"
models:
