<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-boundaries-title lore-boundaries-desc" id="lore-boundaries-root">
        <title id="lore-boundaries-title">The wards — what may not be entered or taken out</title>
        <desc id="lore-boundaries-desc">Boundaries of the wards: the user changes rules in config/boundaries, they compile to one boundaries.json that the guard and the tests both read, the guard enforces them where the work passes through the harness entry points, an agent's write back into the rules stops at the human-owned boundary, and a level-4 rule no mechanism checks is filed as chalk.</desc>
        <defs>
      <style>#lore-boundaries-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lore-boundaries-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lore-boundaries-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lore-boundaries-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="lore-boundaries-lore-boundaries-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="lore-boundaries-lore-boundaries-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lore-boundaries-lore-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lore-boundaries-lore-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#lore-boundaries-lore-boundaries-dots)" opacity="0.55"/>

        <!-- zones, painted first -->
        <rect x="16" y="112" width="344" height="128" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="560" y="112" width="376" height="128" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>

        <!-- connectors: the paved road -->
        <line x1="144" y1="184" x2="184" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-boundaries-lore-boundaries-arrow)"/>
        <line x1="344" y1="184" x2="392" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-boundaries-lore-boundaries-arrow)"/>
        <line x1="528" y1="184" x2="576" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-boundaries-lore-boundaries-arrow)"/>
        <line x1="720" y1="184" x2="768" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-boundaries-lore-boundaries-arrow)"/>
        <line x1="460" y1="216" x2="460" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-boundaries-lore-boundaries-arrow)"/>
        <line x1="268" y1="216" x2="268" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#lore-boundaries-lore-boundaries-arrow)"/>

        <!-- the blocked write, and where the road stops -->
        <path d="M844 152 V96 Q844 88 836 88 H288 Q280 88 280 96 V106" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="272" y1="106" x2="288" y2="106" stroke="#4f5d75" stroke-width="1.5"/>

        <!-- zone eyebrows -->
        <rect x="24" y="111" width="184" height="13" rx="2" fill="#f5f5f5"/>
        <text x="32" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">HUMAN-OWNED · READ BY AGENTS</text>
        <rect x="568" y="111" width="160" height="13" rx="2" fill="#f5f5f5"/>
        <text x="576" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">THE HARNESS ENTRY POINTS</text>

        <!-- arrow labels -->
        <rect x="146" y="166" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="164" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>
        <rect x="346" y="166" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="368" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMPILES</text>
        <rect x="536" y="166" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
        <rect x="722" y="166" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENFORCES</text>
        <rect x="468" y="250" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAME BYTES</text>
        <rect x="192" y="250" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="226" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">NO MECHANISM</text>
        <rect x="665" y="68" width="70" height="12" rx="2" fill="#f5f5f5"/>
        <text x="700" y="77" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO AGENT WRITE</text>

        <!-- the user -->
        <rect x="32" y="152" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="152" width="112" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="40" y="158" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="56" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">USER</text>
        <text x="88" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the user</text>
        <text x="88" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">changes the rules</text>

        <!-- the rules -->
        <rect x="192" y="152" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="192" y="152" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="200" y="158" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="216" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">RULE</text>
        <text x="268" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the rules</text>
        <text x="268" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">config/boundaries</text>

        <!-- the compile -->
        <rect x="392" y="152" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="152" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="400" y="158" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="422" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">COMPILE</text>
        <text x="460" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the compile</text>
        <text x="460" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">boundaries.json</text>

        <!-- the guard: the one accent -->
        <rect x="576" y="152" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="152" width="144" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="584" y="158" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="602" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">GUARD</text>
        <text x="648" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the guard</text>
        <text x="648" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">meets a running agent</text>

        <!-- the entry points -->
        <rect x="768" y="152" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="152" width="152" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="776" y="158" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="792" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">HOOK</text>
        <text x="844" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the entry points</text>
        <text x="844" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">where the work passes</text>

        <!-- the tests -->
        <rect x="384" y="296" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="296" width="152" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="392" y="302" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="408" y="311" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">TEST</text>
        <text x="460" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the tests</text>
        <text x="460" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no harness in the loop</text>

        <!-- chalk -->
        <rect x="192" y="296" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="192" y="296" width="152" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="200" y="302" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="222" y="311" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">LEVEL 4</text>
        <text x="268" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">chalk</text>
        <text x="268" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">nothing checks it</text>

        <!-- what the figure does not claim -->
        <text x="32" y="400" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">every rule carries the level that checks it — a ward is checked, chalk is not</text>
        <text x="32" y="420" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">a path that does not pass the harness hook is not guarded, and the page says so</text>
      </svg>
