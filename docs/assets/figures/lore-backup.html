<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three stores, one restore path</title>
  <!-- 06-system: font source is system; no font link is ever emitted. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment &middot; backup</p>
    <h1>Three stores, one restore path</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-backup-title lore-backup-desc">
        <title id="lore-backup-title">Three stores, one restore path</title>
        <desc id="lore-backup-desc">Deployment of the larder: a timer and the storage rule fill two restic repositories on the working floor and an archive disk a tier below, and the restore path reads all three, because it is the only thing that shows the backups work.</desc>
        <defs>
          <pattern id="lore-backup-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="lore-backup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lore-backup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lore-backup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#lore-backup-dots)" opacity="0.55"/>

        <!-- zones, painted first -->
        <rect x="248" y="64" width="384" height="216" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="248" y="336" width="384" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- connectors -->
        <line x1="216" y1="128" x2="288" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-backup-arrow)"/>
        <path d="M128 160 V216 Q128 224 136 224 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-backup-arrow)"/>
        <path d="M128 312 V392 Q128 400 136 400 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-backup-arrow)"/>
        <path d="M592 128 H656 Q664 128 664 136 V192 Q664 200 672 200 H696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-backup-arrow)"/>
        <line x1="592" y1="240" x2="696" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-backup-arrow)"/>
        <path d="M592 400 H640 Q648 400 648 392 V272 Q648 264 656 264 H696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-backup-arrow)"/>

        <!-- zone labels -->
        <rect x="256" y="63" width="96" height="13" rx="2" fill="#f5f5f5"/>
        <text x="264" y="73" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">WORKING FLOOR</text>
        <rect x="256" y="335" width="156" height="13" rx="2" fill="#f5f5f5"/>
        <text x="264" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">BELOW THE WORKING FLOOR</text>

        <!-- arrow labels -->
        <rect x="232" y="108" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="252" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WRITES</text>
        <rect x="180" y="204" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WRITES</text>
        <rect x="180" y="380" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ADMITS</text>
        <rect x="612" y="108" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READS</text>
        <rect x="628" y="220" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READS</text>
        <rect x="596" y="380" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READS</text>

        <!-- the timer -->
        <rect x="40" y="96" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="102" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="68" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TIMER</text>
        <text x="128" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the timer</text>
        <text x="128" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fills on a schedule</text>

        <!-- the storage rule -->
        <rect x="40" y="248" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="248" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="254" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="64" y="263" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE</text>
        <text x="128" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the storage rule</text>
        <text x="128" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">could this be got again?</text>

        <!-- the mirror -->
        <rect x="288" y="96" width="304" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="96" width="304" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="102" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="316" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESTIC</text>
        <text x="440" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the mirror</text>
        <text x="440" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">restic backups</text>

        <!-- the cellar -->
        <rect x="288" y="192" width="304" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="192" width="304" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="198" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="316" y="207" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESTIC</text>
        <text x="440" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the cellar</text>
        <text x="440" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">restic backups</text>

        <!-- the archive disk -->
        <rect x="288" y="368" width="304" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="368" width="304" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="296" y="374" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="312" y="383" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="440" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the archive disk</text>
        <text x="440" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">archive disks, below the floor</text>

        <!-- the restore path: the focal element -->
        <rect x="696" y="176" width="224" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="176" width="224" height="112" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="704" y="182" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="730" y="191" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROCEDURE</text>
        <text x="808" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the restore path</text>
        <text x="808" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">written down as a procedure</text>

        <!-- the caveat the page keeps -->
        <text x="40" y="480" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">the leaf records the current state as degraded &mdash; stated, not glossed</text>

        <!-- legend -->
        <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="104" y="512" width="24" height="12" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="136" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Floor boundary</text>
        <rect x="248" y="512" width="24" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A restic repository</text>
        <rect x="440" y="512" width="24" height="12" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="472" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">An archive disk</text>
        <rect x="608" y="512" width="24" height="12" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="640" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The restore path</text>
      </svg>
    </div>
  </div>
</body>
</html>
