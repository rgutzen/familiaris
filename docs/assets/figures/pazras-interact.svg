<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pazras-interact-title pazras-interact-desc" id="pazras-interact-root">
        <title id="pazras-interact-title">Two files drive every script</title>
        <desc id="pazras-interact-desc">Architecture diagram: profile.yaml and pazras-master-config.sh, the two driving files, are both read by pazras-config-loader.sh, which every script sources; the scripts act on the seven top-level categories.</desc>
        <defs>
      <style>#pazras-interact-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pazras-interact-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pazras-interact-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pazras-interact-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="pazras-interact-pazras-interact-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
