        <text x="528" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">configuration and automation · the repo</text>
        <rect x="528" y="256" width="332" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="542" y="273" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">config/</text>
        <text x="542" y="287" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the user's decisions, one folder per subject</text>
        <rect x="528" y="308" width="332" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="542" y="325" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">engine/</text>
        <text x="542" y="339" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">generic code, one folder per subject</text>
