<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pazras-tree-title pazras-tree-desc" id="pazras-tree-root">
        <title id="pazras-tree-title">Where everything sits</title>
        <desc id="pazras-tree-desc">Nested containment of the home directory: five PARA categories side by side, 03_ZETTEL drawn apart as permanent and human-only, and 06_SYSTEM containing config, engine and memory.</desc>
        <defs>
      <style>#pazras-tree-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pazras-tree-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pazras-tree-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pazras-tree-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="pazras-tree-pazras-tree-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="pazras-tree-pazras-tree-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#pazras-tree-pazras-tree-dots)" opacity="0.55"/>
