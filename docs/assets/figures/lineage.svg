      <title id="lineage-title">Lineage: borrowed ideas, and where each stops</title>
      <desc id="lineage-desc">Tree: eight sources, each with the idea this system borrowed from it, where the analogy stops, and a confidence tag. Only the McClelland row is an inference from the structure.</desc>
