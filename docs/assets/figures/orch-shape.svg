<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orch-shape-title orch-shape-desc" id="orch-shape-root">
        <title id="orch-shape-title">From catalogue to one model per item</title>
        <desc id="orch-shape-desc">Architecture diagram: models.yaml and profiles.yaml feed selection.yaml, the policy; dispatch reads it for one item of a SPECS.md and assigns one model per item.</desc>
        <defs>
      <style>#orch-shape-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #orch-shape-root { font-family: var(--font-sans); color: var(--color-ink); }
      #orch-shape-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#orch-shape-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="orch-shape-orch-shape-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="orch-shape-orch-shape-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="orch-shape-orch-shape-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#orch-shape-orch-shape-dots)" opacity="0.55"/>
        <!-- Arrows first -->
        <path d="M 200,112 H 232 Q 240,112 240,120 V 148 Q 240,156 248,156 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-shape-orch-shape-arrow)"/>
        <path d="M 200,232 H 232 Q 240,232 240,224 V 196 Q 240,188 248,188 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-shape-orch-shape-arrow)"/>
        <line x1="440" y1="172" x2="520" y2="172" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-shape-orch-shape-arrow-accent)"/>
        <line x1="680" y1="172" x2="760" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-shape-orch-shape-arrow)"/>
        <rect x="460" y="154" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="163" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIERS</text>
        <rect x="694" y="154" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="163" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONE ITEM</text>
        <rect x="40" y="80" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="80" width="160" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="48" y="88" width="60" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="78" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CATALOGUE</text>
        <text x="120" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">models.yaml</text>
        <text x="120" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every callable model</text>
        <rect x="40" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="200" width="160" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="48" y="208" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="74" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROFILE</text>
        <text x="120" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">profiles.yaml</text>
        <text x="120" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">what this machine reaches</text>
        <rect x="280" y="140" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="140" width="160" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="288" y="148" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="310" y="157" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
        <text x="360" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">selection.yaml</text>
        <text x="360" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy, not measurement</text>
        <rect x="520" y="140" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="140" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="528" y="148" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="546" y="157" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
        <text x="600" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dispatch</text>
        <text x="600" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one item of a SPECS.md</text>
        <rect x="760" y="140" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="140" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="768" y="148" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="790" y="157" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
        <text x="840" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">one model per item</text>
        <line x1="40" y1="288" x2="920" y2="288" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="320" width="14" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="62" y="329" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Policy (the focal file)</text>
        <rect x="200" y="320" width="14" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="222" y="329" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input file</text>
        <rect x="312" y="320" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="334" y="329" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step / result</text>
        <line x1="440" y1="326" x2="468" y2="326" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-shape-orch-shape-arrow)"/>
        <text x="476" y="329" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reads</text>
        <line x1="528" y1="326" x2="556" y2="326" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-shape-orch-shape-arrow-accent)"/>
        <text x="564" y="329" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Selects</text>
      </svg>
