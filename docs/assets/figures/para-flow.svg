<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="para-flow-title para-flow-desc" id="para-flow-root">
        <title id="para-flow-title">Where a file moves, and the one move that costs data</title>
        <desc id="para-flow-desc">Data flow: capture lands in 00_INBOX, which feeds the four working folders; finished or inactive content is staged in 05_ARCHIVES on the machine, and the flush on disk attach is the only move that crosses a repository, into 05_ARCHIVES-EXTERNAL on the archive disk.</desc>
        <defs>
      <style>#para-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #para-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #para-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#para-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="para-flow-para-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="para-flow-para-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="para-flow-para-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
