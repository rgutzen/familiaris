<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authority-title authority-desc" id="authority-root">
        <title id="authority-title">Which copy is authoritative</title>
        <desc id="authority-desc">Layer stack of four tiers from the working machine down to the restic repositories: the working machine and the archive disk are authoritative, the staging tier and the repositories are not.</desc>
        <defs>
      <style>#authority-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #authority-root { font-family: var(--font-sans); color: var(--color-ink); }
      #authority-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#authority-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="authority-authority-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="authority-authority-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="authority-authority-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#authority-authority-dots)" opacity="0.55"/>
        <!-- Arrows (drawn first, behind bands) -->
        <path d="M480 120 V152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authority-authority-arrow)"/>
        <path d="M480 232 V264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authority-authority-arrow)"/>
        <path d="M480 344 V376" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#authority-authority-arrow)"/>
        <rect x="496" y="130" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ARCHIVE</text>
        <rect x="496" y="242" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="518" y="251" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">FLUSH</text>
        <rect x="496" y="354" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="522" y="363" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">BACKUP</text>
        <rect x="80" y="40" width="800" height="80" rx="6" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="100" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">TIER 1</text>
        <text x="176" y="74" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The working machine</text>
        <text x="176" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">00_INBOX · 01_PROJECTS · 02_AREAS · 03_ZETTEL · 04_RESOURCES · 06_SYSTEM</text>
        <rect x="724" y="68" width="136" height="24" rx="2" fill="#f5f5f5" stroke="#bf4520"/>
        <text x="792" y="83" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">AUTHORITATIVE</text>
        <rect x="80" y="152" width="800" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="100" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">TIER 2</text>
        <text x="176" y="186" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Archive staging</text>
        <text x="176" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">05_ARCHIVES</text>
        <rect x="724" y="180" width="136" height="24" rx="2" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="792" y="195" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">STAGING ONLY</text>
        <rect x="80" y="264" width="800" height="80" rx="6" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="100" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">TIER 3</text>
        <text x="176" y="298" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The archive disk</text>
        <text x="176" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">05_ARCHIVES-EXTERNAL · owns what is on it, attached or not</text>
        <rect x="724" y="292" width="136" height="24" rx="2" fill="#f5f5f5" stroke="#bf4520"/>
        <text x="792" y="307" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">AUTHORITATIVE</text>
        <rect x="80" y="376" width="800" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="100" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">TIER 4</text>
        <text x="176" y="410" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Restic repositories</text>
        <text x="176" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">outside the tree · a copy, not a move</text>
        <rect x="724" y="404" width="136" height="24" rx="2" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="792" y="419" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">COPY</text>
        <line x1="40" y1="524" x2="920" y2="524" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="558" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="72" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Authoritative tier</text>
        <rect x="232" y="558" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="264" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Not authoritative</text>
        <line x1="424" y1="564" x2="448" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authority-authority-arrow)"/>
        <text x="456" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A move</text>
        <line x1="544" y1="564" x2="568" y2="564" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#authority-authority-arrow)"/>
        <text x="576" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A copy</text>
      </svg>
