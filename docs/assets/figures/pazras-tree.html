<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where everything sits</title>
  <!-- 06-system: font source is system; no font link is ever emitted. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · the tree</p>
    <h1>Where everything sits</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pazras-tree-title pazras-tree-desc">
        <title id="pazras-tree-title">Where everything sits</title>
        <desc id="pazras-tree-desc">Nested containment of the home directory: five PARA categories side by side, 03_ZETTEL drawn apart as permanent and human-only, and 06_SYSTEM containing config, engine and memory.</desc>
        <defs>
          <pattern id="pazras-tree-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="pazras-tree-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#pazras-tree-dots)" opacity="0.55"/>
        <rect x="40" y="40" width="880" height="458" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.45)"/>
        <rect x="56" y="32" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="88" y="43" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">HOME ~/</text>
        <rect x="76" y="76" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="90" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">00_INBOX</text>
        <text x="90" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">CAPTURE</text>
        <rect x="240" y="76" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="254" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">01_PROJECTS</text>
        <text x="254" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ACTION</text>
        <rect x="404" y="76" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="418" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">02_AREAS</text>
        <text x="418" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ACTION</text>
        <rect x="568" y="76" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="582" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">04_RESOURCES</text>
        <text x="582" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">REFERENCE</text>
        <rect x="732" y="76" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="746" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">05_ARCHIVES</text>
        <text x="746" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ARCHIVE</text>
        <rect x="76" y="188" width="380" height="286" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="100" y="216" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">03_ZETTEL</text>
        <text x="100" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Obsidian vault · permanent, never archived</text>
        <rect x="100" y="256" width="148" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="110" y="273" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">00_Inbox</text>
        <text x="110" y="287" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">CAPTURE</text>
        <rect x="264" y="256" width="148" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

        <text x="274" y="339" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">STRUCTURE</text>
        <rect x="100" y="360" width="148" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

        <text x="110" y="391" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">TEMPLATES</text>
        <rect x="264" y="360" width="148" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="274" y="377" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">_assets</text>
        <text x="274" y="391" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">MEDIA</text>
        <text x="100" y="438" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Human-only: no agent reads or writes it.</text>
        <rect x="504" y="188" width="380" height="286" rx="8" fill="rgba(45,49,66,0.025)" stroke="#2d3142"/>
        <text x="528" y="216" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">06_SYSTEM</text>
        <text x="528" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">configuration and automation · the repo</text>
        <rect x="528" y="256" width="332" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="542" y="273" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">config/</text>
        <text x="542" y="287" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the user's decisions, one folder per subject</text>
        <rect x="528" y="308" width="332" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="542" y="325" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">engine/</text>
        <text x="542" y="339" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">generic code, one folder per subject</text>
        <rect x="528" y="360" width="332" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="542" y="377" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">memory/</text>
        <text x="542" y="391" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cross-harness agent knowledge base</text>
                <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="554" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="72" y="563" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Permanent: never archived</text>
        <rect x="280" y="554" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.45)"/>
        <text x="312" y="563" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Container</text>
        <rect x="440" y="554" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="472" y="563" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A category or subfolder</text>
      </svg>
    </div>
  </div>
</body>
</html>
