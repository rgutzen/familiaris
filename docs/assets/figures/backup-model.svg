<svg viewBox="0 0 960 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backup-model-title backup-model-desc" id="backup-model-root">
        <title id="backup-model-title">Three places hold the backups</title>
        <desc id="backup-model-desc">Deployment: the archive disk holds the authoritative archive tree and copies of three repositories. The working machine holds three repositories, each verified on its own cadence. The off-site store holds all four repositories for recovery and a plain mirror for access.</desc>
        <defs>
      <style>#backup-model-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #backup-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #backup-model-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#backup-model-root .diagram-container { overflow-x: visible; }
}</style>
