<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boundary-fanout-title boundary-fanout-desc" id="boundary-fanout-root">
        <title id="boundary-fanout-title">One rule, every surface</title>
        <desc id="boundary-fanout-desc">Architecture diagram: rule files and the vocabulary feed compile.py, which writes the Claude Code and opencode JSON, the Pi policy, advisory pages and the hermes memory block.</desc>
        <defs>
      <style>#boundary-fanout-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #boundary-fanout-root { font-family: var(--font-sans); color: var(--color-ink); }
      #boundary-fanout-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#boundary-fanout-root .diagram-container { overflow-x: visible; }
}</style>
