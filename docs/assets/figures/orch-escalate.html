<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When an item's verify keeps failing</title>
  <!-- 06-system skin, font source: system — no font link -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Lifecycle phase map</p>
    <h1>When an item's verify keeps failing</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orch-escalate-title orch-escalate-desc">
        <title id="orch-escalate-title">When an item's verify keeps failing</title>
        <desc id="orch-escalate-desc">Lifecycle phase map: a dispatched item is verified; after two failed verifies the wrapper raises effort one level, then one tier, each rung a re-dispatch with context; a pass ends the item, and an exhausted ladder prints STOP and hands the decision to the user.</desc>
        <defs>
          <pattern id="orch-escalate-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="orch-escalate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="orch-escalate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#orch-escalate-dots)" opacity="0.55"/>
        <rect x="24" y="44" width="912" height="128" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
        <rect x="24" y="396" width="912" height="112" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
        <text x="40" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECOVERY</text>
        <text x="40" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
        <text x="40" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TERMINAL OUTCOMES</text>
        <!-- Transitions first -->
        <line x1="46" y1="256" x2="64" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="208" y1="256" x2="280" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="424" y1="256" x2="496" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="640" y1="256" x2="712" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="536" y1="220" x2="536" y2="148" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="376" y1="148" x2="376" y2="220" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="352" y1="292" x2="352" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-escalate-arrow)"/>
        <line x1="784" y1="292" x2="784" y2="424" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-escalate-arrow-accent)"/>
        <rect x="220" y="238" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="244" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ATTEMPT</text>
        <rect x="438" y="238" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAIL ×2</text>
        <rect x="648" y="238" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEXT RUNG</text>
        <rect x="544" y="178" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="580" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RE-DISPATCH</text>
        <rect x="390" y="178" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RE-VERIFY</text>
        <rect x="330" y="350" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="352" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASSES</text>
        <rect x="768" y="350" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="359" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STOP</text>
        <circle cx="40" cy="256" r="6" fill="#2d3142"/>
        <rect x="64" y="220" width="144" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="64" y="220" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="136" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatched</text>
        <text x="136" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">model frozen at planning</text>
        <rect x="280" y="220" width="144" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="280" y="220" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify</text>
        <text x="352" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">wrapper prints next rung</text>
        <rect x="496" y="220" width="144" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="496" y="220" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="568" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Effort up</text>
        <text x="568" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one level, once per model</text>
        <rect x="712" y="220" width="144" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="712" y="220" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="784" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tier up</text>
        <text x="784" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the cheapest member</text>
        <rect x="336" y="76" width="240" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="336" y="76" width="240" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="344" y="84" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
        <text x="362" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text>
        <text x="456" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-dispatch</text>
        <text x="456" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">with context, never mid-session</text>
        <rect x="280" y="424" width="144" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="280" y="424" width="144" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="288" y="432" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
        <text x="316" y="441" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
        <text x="352" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verified</text>
        <text x="352" y="478" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the verify passes</text>
        <rect x="712" y="424" width="144" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="712" y="424" width="144" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="720" y="432" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
        <text x="748" y="441" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
        <text x="784" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You decide</text>
        <text x="784" y="478" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the wrapper prints STOP</text>
        <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="556" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="62" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Phase</text>
        <rect x="120" y="556" width="14" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="142" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Recovery</text>
        <rect x="220" y="556" width="14" height="12" rx="2" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text x="242" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal</text>
        <rect x="320" y="556" width="14" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="342" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Hand-back to you</text>
        <line x1="468" y1="562" x2="496" y2="562" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-escalate-arrow)"/>
        <text x="504" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>
        <line x1="576" y1="562" x2="604" y2="562" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#orch-escalate-arrow)"/>
        <text x="612" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Re-dispatch</text>
        <line x1="684" y1="562" x2="712" y2="562" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-escalate-arrow-accent)"/>
        <text x="720" y="565" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stop</text>
      </svg>
    </div>
  </div>
</body>
</html>
