<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="filing-title filing-desc" id="filing-root">
        <title id="filing-title">Where a thing goes</title>
        <desc id="filing-desc">Flowchart of the filing decision: an undecided item in 00_INBOX meets five questions in turn, and the first yes names its PARA folder; a claim worth keeping goes to 03_ZETTEL, and anything undecided stays in the inbox.</desc>
        <defs>
      <style>#filing-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #filing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #filing-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#filing-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="filing-filing-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="filing-filing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="filing-filing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#filing-filing-dots)" opacity="0.55"/>
        <!-- Arrows (drawn first, behind nodes) -->
        <path d="M240 60 H324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M596 60 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M460 96 V124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M596 160 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M460 196 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M596 260 H660" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#filing-filing-arrow-accent)"/>
        <path d="M460 296 V324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M596 360 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M460 396 V424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M596 460 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filing-filing-arrow)"/>
        <path d="M324 460 H168 Q160 460 160 452 V82" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#filing-filing-arrow)"/>
        <!-- Arrow labels -->
        <rect x="604" y="40" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="49" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="474" y="104" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="113" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="604" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="474" y="204" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="604" y="240" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="249" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="474" y="304" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="604" y="340" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="474" y="404" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="604" y="440" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="202" y="440" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO · STAYS</text>
        <!-- Nodes -->
        <rect x="80" y="38" width="160" height="44" rx="20" fill="#2d3142" stroke="#2d3142" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="160" y="57" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">00_INBOX</text>
        <text x="160" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">undecided</text>
        <polygon points="460,24 596,60 460,96 324,60" fill="#ffffff" stroke="#2d3142"/>
        <text x="460" y="57" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A defined outcome</text>
        <text x="460" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">and a deadline?</text>
        <rect x="660" y="38" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="760" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">01_PROJECTS</text>
        <polygon points="460,124 596,160 460,196 324,160" fill="#ffffff" stroke="#2d3142"/>
        <text x="460" y="157" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">An ongoing</text>
        <text x="460" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">responsibility?</text>
        <rect x="660" y="138" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="760" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">02_AREAS</text>
        <polygon points="460,224 596,260 460,296 324,260" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="460" y="257" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A claim worth keeping,</text>
        <text x="460" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">not an action?</text>
        <rect x="660" y="238" width="200" height="44" rx="6" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="760" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">03_ZETTEL</text>
        <polygon points="460,324 596,360 460,396 324,360" fill="#ffffff" stroke="#2d3142"/>
        <text x="460" y="357" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Consulted across</text>
        <text x="460" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">projects and areas?</text>
        <rect x="660" y="338" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="760" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">04_RESOURCES</text>
        <polygon points="460,424 596,460 460,496 324,460" fill="#ffffff" stroke="#2d3142"/>
        <text x="460" y="457" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The system</text>
        <text x="460" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">itself?</text>
        <rect x="660" y="438" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="760" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">06_SYSTEM</text>
        <line x1="40" y1="524" x2="920" y2="524" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="558" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Where it starts</text>
        <polygon points="212,564 224,558 236,564 224,570" fill="#ffffff" stroke="#2d3142"/>
        <text x="244" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A filing question</text>
        <rect x="408" y="558" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="440" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A PARA folder</text>
        <line x1="568" y1="564" x2="592" y2="564" stroke="#bf4520" stroke-width="1.4" marker-end="url(#filing-filing-arrow-accent)"/>
        <text x="600" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The permanent store</text>
        <line x1="760" y1="564" x2="784" y2="564" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#filing-filing-arrow)"/>
        <text x="792" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Undecided stays</text>
      </svg>
