<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-knowledge-title lore-knowledge-desc" id="lore-knowledge-root">
        <title id="lore-knowledge-title">One index level, then a leaf</title>
        <desc id="lore-knowledge-desc">Tree diagram of the grimoire: a session matches trigger terms against the single generated INDEX.md, which fans out to the subject folders and down to a leaf that carries its own standing, while engine/knowledge reads the tree and config/knowledge holds the vocabulary they resolve against.</desc>
        <defs>
      <style>#lore-knowledge-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lore-knowledge-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lore-knowledge-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lore-knowledge-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="lore-knowledge-lore-knowledge-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="lore-knowledge-lore-knowledge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lore-knowledge-lore-knowledge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lore-knowledge-lore-knowledge-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#lore-knowledge-lore-knowledge-dots)" opacity="0.55"/>

        <!-- connectors, drawn before the boxes -->
        <line x1="680" y1="112" x2="680" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-knowledge-lore-knowledge-arrow)"/>
        <path d="M632 240 V264 Q632 272 624 272 H556 Q548 272 548 280 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-knowledge-lore-knowledge-arrow)"/>
        <path d="M728 240 V264 Q728 272 736 272 H804 Q812 272 812 280 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-knowledge-lore-knowledge-arrow)"/>
        <line x1="548" y1="352" x2="548" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-knowledge-lore-knowledge-arrow)"/>
        <line x1="280" y1="208" x2="540" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-knowledge-lore-knowledge-arrow)"/>
        <line x1="164" y1="288" x2="164" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-knowledge-lore-knowledge-arrow)"/>

        <!-- arrow labels: mask, then text, each 6-10px clear of its connector -->
        <rect x="688" y="128" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="714" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MATCHES</text>
        <rect x="556" y="368" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="586" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ONE FACT</text>
        <rect x="384" y="188" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="408" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
        <rect x="172" y="260" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="202" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVES</text>

        <!-- a session, at the agent entry point -->
        <rect x="580" y="48" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="580" y="48" width="200" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="588" y="54" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="612" y="63" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">SESSION</text>
        <text x="680" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a session</text>
        <text x="680" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the agent entry point</text>

        <!-- the index: the one level of disclosure, generated fits here -->
        <rect x="540" y="168" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="168" width="280" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="548" y="174" width="40" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="568" y="183" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">INDEX</text>
        <text x="680" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the index</text>
        <text x="680" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">memory/knowledge/INDEX.md</text>
        <text x="680" y="233" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every fact, one line</text>

        <!-- subject folders -->
        <rect x="464" y="288" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="288" width="168" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="472" y="294" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="496" y="303" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">SUBJECT</text>
        <text x="548" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">system/</text>
        <text x="548" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">filed by subject</text>

        <rect x="728" y="288" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="288" width="168" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="736" y="294" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="760" y="303" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">SUBJECT</text>
        <text x="812" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">areas/</text>
        <text x="812" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">filed by subject</text>

        <!-- a leaf: a claim with its standing attached -->
        <rect x="452" y="400" width="192" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="452" y="400" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="460" y="406" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="478" y="415" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">LEAF</text>
        <text x="548" y="438" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a leaf</text>
        <text x="548" y="453" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a claim, with its standing</text>
        <text x="548" y="465" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">trust · authority · scope</text>

        <!-- engine/knowledge: the reader of the tree -->
        <rect x="48" y="168" width="232" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="168" width="232" height="80" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="56" y="174" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="78" y="183" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">ENGINE</text>
        <text x="164" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">engine/knowledge</text>
        <text x="164" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">index · search · checkers · glossary</text>

        <!-- config/knowledge: the vocabulary the readers resolve against -->
        <rect x="48" y="288" width="232" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="288" width="232" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="56" y="294" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="78" y="303" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">CONFIG</text>
        <text x="164" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">config/knowledge</text>
        <text x="164" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the vocabulary they resolve</text>

        <!-- the refusal the page keeps -->
        <text x="40" y="496" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">a second index level was refused — it would be a second place for the truth to live</text>

        <!-- legend -->
        <line x1="40" y1="516" x2="920" y2="516" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="104" y="528" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="136" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A session</text>
        <rect x="216" y="528" width="24" height="12" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="248" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A subject folder</text>
        <rect x="356" y="528" width="24" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="388" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A leaf</text>
        <rect x="444" y="528" width="24" height="12" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="476" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The index — generated</text>
        <rect x="608" y="528" width="24" height="12" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="640" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A reader</text>
      </svg>
