<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills tree</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Skills</p>
    <h1>Skills routing and storage</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-skills-title lore-skills-desc">
        <title id="lore-skills-title">Skills tree: router, bundle, drawer</title>
        <desc id="lore-skills-desc">A tree diagram showing skills organized as router leading to bundle which leads to drawer, illustrating the zero-install design choice.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="{muted}"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="{accent}"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="{link}"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="{paper}"/>

        <!-- Draw arrows first, then nodes -->
        
        <!-- Connector from router to bundle -->
        <path d="M 480 80 V 120 H 360" stroke="{muted}" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        
        <!-- Connector from bundle to drawer -->
        <path d="M 360 160 V 200 H 480" stroke="{muted}" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        
        <!-- Nodes -->
        <!-- Router node -->
        <rect x="420" y="60" width="120" height="44" rx="6" fill="{paper}" stroke="{accent}" stroke-width="1"/>
        <rect x="428" y="66" width="28" height="12" rx="2" fill="transparent" stroke="{accent}" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="442" y="75" fill="{accent}" font-size="7" font-family="{eyebrow}" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="480" y="88" fill="{ink}" font-size="12" font-weight="600" font-family="{node-name}" text-anchor="middle">router</text>
        <text x="480" y="106" fill="{muted}" font-size="9" font-family="{sublabel}" text-anchor="middle">tech:resolve</text>
        
        <!-- Bundle node (accent) -->
        <rect x="300" y="140" width="120" height="44" rx="6" fill="{accent}" stroke="{accent}" stroke-width="1"/>
        <rect x="308" y="146" width="28" height="12" rx="2" fill="transparent" stroke="{ink}" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="322" y="155" fill="{ink}" font-size="7" font-family="{eyebrow}" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="360" y="168" fill="{paper}" font-size="12" font-weight="600" font-family="{node-name}" text-anchor="middle">bundle</text>
        <text x="360" y="186" fill="{paper}@0.80" font-size="9" font-family="{sublabel}" text-anchor="middle">tech:fetch</text>
        
        <!-- Drawer node -->
        <rect x="420" y="220" width="120" height="44" rx="6" fill="{paper}" stroke="{muted}" stroke-width="1"/>
        <rect x="428" y="226" width="28" height="12" rx="2" fill="transparent" stroke="{muted}" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="442" y="235" fill="{muted}" font-size="7" font-family="{eyebrow}" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="480" y="248" fill="{ink}" font-size="12" font-weight="600" font-family="{node-name}" text-anchor="middle">drawer</text>
        <text x="480" y="266" fill="{muted}" font-size="9" font-family="{sublabel}" text-anchor="middle">tech:serve</text>

      </svg>
    </div>
  </div>
</body>
</html>
