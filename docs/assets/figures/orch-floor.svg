<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orch-floor-title orch-floor-desc" id="orch-floor-root">
        <title id="orch-floor-title">Does the wrapper floor stop a delegated call?</title>
        <desc id="orch-floor-desc">Flowchart: a delegated ask meets a wrapper floor test. With no floor the user's own rules apply. With a floor, a call whose every statement is a delegation with no command substitution is allowed and logged; otherwise it is deferred and the user is asked.</desc>
        <defs>
      <style>#orch-floor-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #orch-floor-root { font-family: var(--font-sans); color: var(--color-ink); }
      #orch-floor-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#orch-floor-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="orch-floor-orch-floor-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="orch-floor-orch-floor-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="orch-floor-orch-floor-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#orch-floor-orch-floor-dots)" opacity="0.55"/>
        <!-- Arrows first -->
        <line x1="480" y1="80" x2="480" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-floor-orch-floor-arrow)"/>
        <line x1="580" y1="160" x2="720" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-floor-orch-floor-arrow)"/>
        <line x1="480" y1="208" x2="480" y2="248" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-floor-orch-floor-arrow-accent)"/>
        <line x1="620" y1="304" x2="720" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-floor-orch-floor-arrow)"/>
        <line x1="480" y1="360" x2="480" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-floor-orch-floor-arrow-accent)"/>
        <rect x="638" y="142" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="650" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="496" y="222" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="231" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="658" y="286" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="670" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="496" y="374" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="383" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="400" y="32" width="160" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="400" y="32" width="160" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="480" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the ask</text>
        <text x="480" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">env X=1 pi-agent …</text>
        <polygon points="480,112 580,160 480,208 380,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a wrapper floor?</text>
        <rect x="720" y="128" width="200" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="720" y="128" width="200" height="64" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="820" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your own rules apply</text>
        <text x="820" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">as written</text>
        <polygon points="480,248 620,304 480,360 340,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">every statement a</text>
        <text x="480" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">delegation, no command</text>
        <text x="480" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">substitution?</text>
        <rect x="720" y="272" width="200" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="720" y="272" width="200" height="64" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="820" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">deferred</text>
        <text x="820" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">you are asked</text>
        <rect x="400" y="400" width="160" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="400" y="400" width="160" height="56" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="480" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">allowed</text>
        <text x="480" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reason logged</text>
        <line x1="40" y1="476" x2="920" y2="476" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="508" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="517" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>
        <rect x="208" y="508" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="517" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>
        <rect x="376" y="508" width="14" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="398" y="517" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Delegation allowed</text>
        <line x1="544" y1="514" x2="572" y2="514" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#orch-floor-orch-floor-arrow)"/>
        <text x="580" y="517" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
        <line x1="644" y1="514" x2="672" y2="514" stroke="#bf4520" stroke-width="1.4" marker-end="url(#orch-floor-orch-floor-arrow-accent)"/>
        <text x="680" y="517" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Delegation path</text>
      </svg>
