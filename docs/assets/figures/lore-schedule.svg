<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-schedule-title lore-schedule-desc" id="lore-schedule-root">
        <title id="lore-schedule-title">One day of timers — the Almanac</title>
        <desc id="lore-schedule-desc">Timeline of one day in the scheduler: the daily timers fire at their set hours — the backup at midnight, the nightly pass at 03:30, the sync, the highlights and the journal index in the morning — while the dispatcher wakes every five minutes all day.</desc>
        <defs>
      <style>#lore-schedule-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lore-schedule-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lore-schedule-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lore-schedule-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="lore-schedule-lore-schedule-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lore-schedule-lore-schedule-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lore-schedule-lore-schedule-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- the mechanism, as words (schedule.md, The mechanism) -->
        <text x="80" y="56" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">each unit declares when it fires,</text>
        <text x="80" y="76" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">what it runs, and what it may write</text>

        <!-- baseline, broken between 07:00 and the compressed rest of the day -->
        <line x1="80" y1="200" x2="640" y2="200" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.45"/>
        <line x1="664" y1="200" x2="920" y2="200" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.45"/>
        <line x1="648" y1="192" x2="648" y2="208" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
        <line x1="656" y1="192" x2="656" y2="208" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>

        <!-- hour ticks, 00:00-07:00 at 80 px/h -->
        <line x1="80" y1="194" x2="80" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="160" y1="194" x2="160" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="240" y1="194" x2="240" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="320" y1="194" x2="320" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="400" y1="194" x2="400" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="480" y1="194" x2="480" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="560" y1="194" x2="560" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="640" y1="194" x2="640" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <text x="80" y="222" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">00:00</text>
        <text x="240" y="222" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">02:00</text>
        <text x="400" y="222" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">04:00</text>
        <text x="640" y="222" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">07:00</text>

        <!-- compressed tail, 07:00-24:00 -->
        <line x1="740" y1="194" x2="740" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="830" y1="194" x2="830" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <line x1="920" y1="194" x2="920" y2="206" stroke="#2d3142" stroke-width="1" stroke-opacity="0.20"/>
        <text x="740" y="222" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">12:00</text>
        <text x="830" y="222" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">COMPRESSED</text>
        <text x="920" y="222" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">24:00</text>

        <!-- 00:00 · pazras-backup (below) -->
        <line x1="80" y1="200" x2="80" y2="242" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
        <circle cx="80" cy="200" r="4" fill="#2d3142"/>
        <text x="80" y="258" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">00:00</text>
        <text x="80" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the backup</text>
        <text x="80" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pazras-backup</text>

        <!-- 03:30 · familiar-memory, the nightly pass — the accent: the unattended writer -->
        <line x1="360" y1="200" x2="360" y2="142" stroke="#bf4520" stroke-width="1"/>
        <circle cx="360" cy="200" r="6" fill="#bf4520"/>
        <text x="360" y="96" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">03:30</text>
        <text x="360" y="114" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the nightly pass</text>
        <text x="360" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">familiar-memory &#183; 9 stages</text>

        <!-- 04:30 · pazras-sync (below) -->
        <line x1="440" y1="200" x2="440" y2="242" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
        <circle cx="440" cy="200" r="4" fill="#2d3142"/>
        <text x="440" y="258" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">04:30</text>
        <text x="440" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the sync</text>
        <text x="440" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pazras-sync</text>

        <!-- 06:00 · familiar-highlights (above) -->
        <line x1="560" y1="200" x2="560" y2="158" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
        <circle cx="560" cy="200" r="4" fill="#2d3142"/>
        <text x="560" y="136" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">06:00</text>
        <text x="560" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the highlights</text>

        <!-- 06:15 · familiar-journal-index (below) -->
        <line x1="572" y1="200" x2="572" y2="242" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
        <circle cx="572" cy="200" r="4" fill="#2d3142"/>
        <text x="572" y="258" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">06:15</text>
        <text x="572" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the journal index</text>
        <text x="572" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">familiar-journal-index</text>

        <!-- the dispatcher: every 5 minutes, all day -->
        <rect x="80" y="312" width="560" height="4" fill="#4f5d75" opacity="0.45"/>
        <rect x="664" y="312" width="256" height="4" fill="#4f5d75" opacity="0.45"/>
        <text x="80" y="336" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">FAMILIAR-DISPATCH &#183; EVERY 5 MIN</text>
        <text x="80" y="352" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the dispatcher decides which scheduled job may start</text>

        <!-- legend -->
        <line x1="40" y1="372" x2="920" y2="372" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <circle cx="116" cy="389" r="4" fill="#2d3142"/>
        <text x="132" y="392" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">a daily timer fires</text>
        <circle cx="268" cy="389" r="6" fill="#bf4520"/>
        <text x="284" y="392" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the unattended writer</text>

        <!-- the caveat the page keeps -->
        <text x="40" y="416" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">a unit that has never fired is untested rather than reliable &#8212; the log is the evidence</text>
      </svg>
