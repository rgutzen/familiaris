<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopting a skill: where it goes and which mode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · How-to</p>
    <h1>Adopting a skill: where it goes and which mode</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adopt-decide-title adopt-decide-desc">
        <title id="adopt-decide-title">Adopting a skill: where it goes and which mode</title>
        <desc id="adopt-decide-desc">Flowchart that sends a claim to the knowledge tree, asks for a registered subject, and then picks authored, derive, vendor or link mode from the source of the body.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first -->
        <line x1="580" y1="84" x2="690" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="128" x2="480" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="224" x2="690" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="268" x2="480" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="364" x2="690" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="380" y1="364" x2="270" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="408" x2="480" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="504" x2="690" y2="504" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="380" y1="504" x2="270" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="615" y="64" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="635" y="73" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
        <rect x="488" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROCEDURE</text>
        <rect x="623" y="204" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="635" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="488" y="288" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="601" y="344" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="635" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO SOURCE</text>
        <rect x="299" y="344" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="325" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILDER</text>
        <rect x="488" y="428" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="514" y="437" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSTREAM</text>
        <rect x="619" y="484" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="635" y="493" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="313" y="484" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="325" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <!-- Nodes -->
        <polygon points="480,40 580,84 480,128 380,84" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A procedure</text>
        <text x="480" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">or a claim?</text>
        <polygon points="480,180 580,224 480,268 380,224" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Subject in the</text>
        <text x="480" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">register?</text>
        <polygon points="480,320 580,364 480,408 380,364" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Where does the</text>
        <text x="480" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">body come from?</text>
        <polygon points="480,460 580,504 480,548 380,504" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="502" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Upstream alive,</text>
        <text x="480" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">or copy barred?</text>
        <rect x="690" y="56" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="770" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Knowledge tree</text>
        <text x="770" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">memory/knowledge/</text>
        <rect x="690" y="196" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="770" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Propose subject</text>
        <text x="770" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user decides</text>
        <rect x="690" y="336" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="770" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">authored</text>
        <text x="770" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">written by you</text>
        <rect x="110" y="336" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="190" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">derive</text>
        <text x="190" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">builder generates</text>
        <rect x="690" y="476" width="160" height="56" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="770" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">link</text>
        <text x="770" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">body stays upstream</text>
        <rect x="110" y="476" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="190" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vendor</text>
        <text x="190" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">body copied in</text>

        <!-- Legend -->
        <line x1="40" y1="588" x2="920" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <polygon points="52,626 64,620 76,626 64,632" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="88" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Question</text>
        <rect x="200" y="620" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="236" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Outcome</text>
        <line x1="340" y1="626" x2="368" y2="626" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="376" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Default for upstream skills</text>
      </svg>
    </div>
  </div>
</body>
</html>
