<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="displacement-title displacement-desc" id="displacement-root">
        <title id="displacement-title">What leaves a tier, and when</title>
        <desc id="displacement-desc">Data flow from a session through the journal and knowledge tiers to archive staging and the archive disk; only the flush from staging to the disk crosses into another repository.</desc>
        <defs>
      <style>#displacement-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #displacement-root { font-family: var(--font-sans); color: var(--color-ink); }
      #displacement-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#displacement-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="displacement-displacement-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="displacement-displacement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="displacement-displacement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#displacement-displacement-dots)" opacity="0.55"/>
        <!-- Arrows (drawn first, behind nodes) -->
        <path d="M200 88 H288 Q296 88 296 96 V152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#displacement-displacement-arrow)"/>
        <path d="M380 184 H468 Q476 184 476 192 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#displacement-displacement-arrow)"/>
        <path d="M560 280 H648 Q656 280 656 288 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#displacement-displacement-arrow)"/>
        <path d="M740 376 H828 Q836 376 836 384 V440" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#displacement-displacement-arrow-accent)"/>
        <rect x="220" y="66" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="75" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">CAPTURE</text>
        <rect x="384" y="162" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="428" y="171" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NIGHTLY PASS</text>
        <rect x="582" y="258" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">DISUSE</text>
        <rect x="766" y="354" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="788" y="363" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">FLUSH</text>
        <text x="560" y="112" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Nothing here deletes a leaf:</text>
        <text x="560" y="132" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">disuse proposes, the user acts.</text>
        <rect x="32" y="56" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="116" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A session</text>
        <rect x="212" y="152" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4,3"/>
        <text x="296" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Journal · fast tier</text>
        <text x="296" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">memory/journal</text>
        <rect x="392" y="248" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="476" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Knowledge · slow tier</text>
        <text x="476" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">memory/knowledge</text>
        <rect x="572" y="344" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="656" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Archive staging</text>
        <text x="656" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">05_ARCHIVES</text>
        <rect x="752" y="440" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="836" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Archive disk</text>
        <text x="836" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">05_ARCHIVES-EXTERNAL</text>
        <line x1="40" y1="524" x2="920" y2="524" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="558" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="72" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A tier or store</text>
        <rect x="232" y="558" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4,3"/>
        <text x="264" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Not in the public export</text>
        <line x1="472" y1="564" x2="496" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#displacement-displacement-arrow)"/>
        <text x="504" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A move within one repo</text>
        <line x1="704" y1="564" x2="728" y2="564" stroke="#bf4520" stroke-width="1.4" marker-end="url(#displacement-displacement-arrow-accent)"/>
        <text x="736" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The step that crosses a repo</text>
      </svg>
