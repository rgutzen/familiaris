<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The four kinds of documentation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · docs/</p>
    <h1>The four kinds of documentation</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diataxis-title diataxis-desc">
      <title id="diataxis-title">The four kinds of documentation</title>
      <desc id="diataxis-desc">Quadrant of the four Diataxis kinds on two axes, practical versus theoretical and acquisition versus application: tutorial, how-to, explanation and reference, each with its folder. Explanation is the focal cell.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#2d3142"/></marker>
        <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="140" y1="276" x2="820" y2="276" stroke="rgba(45,49,66,0.45)" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
<line x1="480" y1="60" x2="480" y2="492" stroke="rgba(45,49,66,0.45)" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
<text x="128" y="280" font-size="9" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">ACQUISITION</text>
<text x="832" y="280" font-size="9" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">APPLICATION</text>
<text x="480" y="48" font-size="9" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">PRACTICAL</text>
<text x="480" y="512" font-size="9" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">THEORETICAL</text>
<rect x="160" y="76" width="280" height="176" rx="6" fill="#f5f5f5"/><rect x="160" y="76" width="280" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
<text x="176" y="104" font-size="8" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">TUTORIAL</text>
<text x="176" y="136" font-size="16" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-weight="600">the Initiation</text>
<text x="176" y="156" font-size="9" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace">tutorial/</text>
<text x="176" y="188" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">Learning. One end-to-end walk,</text>
<text x="176" y="204" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">on a scratch tree.</text>
<rect x="520" y="76" width="280" height="176" rx="6" fill="#f5f5f5"/><rect x="520" y="76" width="280" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
<text x="536" y="104" font-size="8" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">HOW-TO</text>
<text x="536" y="136" font-size="16" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-weight="600">the Spellbook</text>
<text x="536" y="156" font-size="9" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace">how-to/</text>
<text x="536" y="188" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">A task. Four recipes, each run</text>
<text x="536" y="204" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">once as written.</text>
<rect x="160" y="300" width="280" height="176" rx="6" fill="#f5f5f5"/><rect x="160" y="300" width="280" height="176" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="176" y="328" font-size="8" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" letter-spacing="0.18em">EXPLANATION</text>
<text x="176" y="360" font-size="16" fill="#bf4520" font-family="'Geist', system-ui, sans-serif" font-weight="600">Explanation</text>
<text x="176" y="380" font-size="9" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace">explanation/</text>
<text x="176" y="412" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">Understanding. Why it is built this</text>
<text x="176" y="428" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">way, with the lineage and the lore.</text>
<rect x="520" y="300" width="280" height="176" rx="6" fill="#f5f5f5"/><rect x="520" y="300" width="280" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
<text x="536" y="328" font-size="8" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">REFERENCE</text>
<text x="536" y="360" font-size="16" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-weight="600">Reference</text>
<text x="536" y="380" font-size="9" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace">reference/</text>
<text x="536" y="412" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">Lookup. An index linking the existing</text>
<text x="536" y="428" font-size="11" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">documents, plus the generated maps.</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="556" font-size="8" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="568" width="14" height="10" rx="2" fill="#f5f5f5"/><rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="60" y="576" font-size="8.5" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">Explanation, the focal kind</text>
<rect x="320" y="568" width="14" height="10" rx="2" fill="#f5f5f5"/><rect x="320" y="568" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
<text x="340" y="576" font-size="8.5" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif">Other kinds</text>
<text x="460" y="576" font-size="8.5" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-style="italic">A page belongs to one cell. Reference and explanation carry no mythic name.</text>
    </svg>
  </div>
</body>
</html>
