<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a file moves, and the one move that costs data</title>
  <!-- 06-system: font source is system; no font link is ever emitted. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · storage</p>
    <h1>Where a file moves, and the one move that costs data</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="para-flow-title para-flow-desc">
        <title id="para-flow-title">Where a file moves, and the one move that costs data</title>
        <desc id="para-flow-desc">Data flow: capture lands in 00_INBOX, which feeds the four working folders; finished or inactive content is staged in 05_ARCHIVES on the machine, and the flush on disk attach is the only move that crosses a repository, into 05_ARCHIVES-EXTERNAL on the archive disk.</desc>
        <defs>
          <pattern id="para-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="para-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="para-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#para-flow-dots)" opacity="0.55"/>
        <rect x="24" y="40" width="724" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="32" y="34" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="36" y="43" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WORKING MACHINE</text>
        <rect x="780" y="40" width="156" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="788" y="34" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="792" y="43" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ARCHIVE DISK</text>
        <text x="450" y="56" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">ARCHIVE WHEN COMPLETE OR INACTIVE</text>
        <line x1="140" y1="176" x2="176" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <line x1="296" y1="176" x2="328" y2="176" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="328" y1="86" x2="328" y2="266" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="328" y1="86" x2="360" y2="86" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <line x1="540" y1="86" x2="562" y2="86" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="328" y1="146" x2="360" y2="146" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <line x1="540" y1="146" x2="562" y2="146" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="328" y1="206" x2="360" y2="206" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <line x1="540" y1="206" x2="562" y2="206" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="328" y1="266" x2="360" y2="266" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <line x1="540" y1="266" x2="562" y2="266" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="562" y1="86" x2="562" y2="266" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="562" y1="176" x2="584" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <line x1="724" y1="176" x2="796" y2="176" stroke="#bf4520" stroke-width="1.4" marker-end="url(#para-flow-arrow-accent)"/>
        <rect x="749.0" y="159" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="168" fill="#bf4520" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FLUSH</text>
        <rect x="40" y="154" width="100" height="44" rx="20" fill="#f5f5f5"/>
        <rect x="40" y="154" width="100" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="90" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">capture</text>
        <rect x="176" y="152" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="236" y="181" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">00_INBOX</text>
        <rect x="360" y="64" width="180" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="91" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">01_PROJECTS</text>
        <rect x="360" y="124" width="180" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="151" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">02_AREAS</text>
        <rect x="360" y="184" width="180" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="211" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">03_ZETTEL</text>
        <rect x="360" y="244" width="180" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="271" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">04_RESOURCES</text>
        <rect x="584" y="148" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="654" y="173" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Local staging</text>
        <text x="654" y="190" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">~/05_ARCHIVES</text>
        <rect x="796" y="148" width="124" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="858" y="173" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Archive disk</text>
        <text x="858" y="190" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">05_ARCHIVES-EXTERNAL</text>
        <line x1="40" y1="332" x2="920" y2="332" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="348" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="364" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="72" y="373" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Folder or tier</text>
        <line x1="200" y1="370" x2="224" y2="370" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#para-flow-arrow)"/>
        <text x="232" y="373" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Move inside a repository</text>
        <line x1="400" y1="370" x2="424" y2="370" stroke="#bf4520" stroke-width="1.4" marker-end="url(#para-flow-arrow-accent)"/>
        <text x="432" y="373" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Flush on attach: crosses a repository</text>
        <rect x="640" y="364" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="672" y="373" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Machine or disk</text>

      </svg>
    </div>
  </div>
</body>
</html>
