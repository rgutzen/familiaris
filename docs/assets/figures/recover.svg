<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recover-title recover-desc" id="recover-root">
        <title id="recover-title">Recover one file from a restic backup</title>
        <desc id="recover-desc">Flowchart: find the repository, open it read-only, and if it opens, look inside the snapshot, restore to a scratch target, check the bytes, and only then put the file back. Without a passphrase, stop and ask the user; if the check fails, do not prune or forget.</desc>
        <defs>
      <style>#recover-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #recover-root { font-family: var(--font-sans); color: var(--color-ink); }
      #recover-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#recover-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="recover-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (behind nodes) -->
        <line x1="192" y1="88" x2="224" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recover-arrow)"/>
        <line x1="376" y1="88" x2="416" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recover-arrow)"/>
        <line x1="528" y1="88" x2="568" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recover-arrow)"/>
        <line x1="720" y1="88" x2="752" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recover-arrow)"/>
        <line x1="828" y1="112" x2="828" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recover-arrow)"/>
        <line x1="752" y1="224" x2="720" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recover-arrow)"/>
        <line x1="472" y1="128" x2="472" y2="200" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recover-arrow)"/>
        <line x1="828" y1="248" x2="828" y2="300" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recover-arrow)"/>

        <!-- Arrow labels -->
        <rect x="536" y="70" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="79" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="480" y="156" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="836" y="268" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="872" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECK FAILS</text>

        <!-- Nodes -->
        <rect x="40" y="64" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="116" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1 · Find the repo</text>
        <text x="116" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RESTIC_REPOS</text>
        <rect x="224" y="64" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2 · Open read-only</text>
        <text x="300" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">snapshots --tag</text>
        <polygon points="472,48 528,88 472,128 416,88" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="472" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Does it</text>
        <text x="472" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">open?</text>
        <rect x="568" y="64" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="644" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3 · Look inside</text>
        <text x="644" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ls snapshot path</text>
        <rect x="752" y="64" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="828" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4 · Bring it out</text>
        <text x="828" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">restore to scratch</text>
        <rect x="752" y="200" width="152" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="828" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5 · Check it</text>
        <text x="828" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cmp + check</text>
        <rect x="568" y="200" width="152" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="644" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6 · Put it back</text>
        <text x="644" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">--target /, file only</text>
        <rect x="400" y="200" width="144" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="472" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">No passphrase</text>
        <text x="472" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">never invent one</text>
        <rect x="752" y="300" width="152" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="828" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Check fails</text>
        <text x="828" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no prune, no forget</text>
      </svg>
