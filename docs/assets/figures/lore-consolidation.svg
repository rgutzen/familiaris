<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-consolidation-title lore-consolidation-desc" id="lore-consolidation-root">
        <title id="lore-consolidation-title">the Vigil — the nightly pass</title>
        <desc id="lore-consolidation-desc">A loop: a session's capture flows clockwise into the nightly pass, past the invariants the pass declares, into the leaves it writes, and out to the next session's context. Every station writes back into one record in the centre, which the next pass reads.</desc>
        <defs>
      <style>#lore-consolidation-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08);
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #lore-consolidation-root { color: var(--ink); font-family: var(--sans); }
      #lore-consolidation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lore-consolidation-root .diagram-container { overflow-x: visible; }
}
      #lore-consolidation-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #lore-consolidation-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #lore-consolidation-root .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #lore-consolidation-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #lore-consolidation-root .hub { fill: var(--ink); }
      #lore-consolidation-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #lore-consolidation-root .focal-name { fill: var(--accent); }
      #lore-consolidation-root .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
      #lore-consolidation-root .hub-name { fill: var(--paper); font: 600 15px var(--sans); text-anchor: middle; }
      #lore-consolidation-root .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
      #lore-consolidation-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      #lore-consolidation-root .legend-label { fill: var(--muted); font: 400 8.5px var(--sans); }
      #lore-consolidation-root .legend-eyebrow { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.18em; }</style>
          <marker id="lore-consolidation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lore-consolidation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lore-consolidation-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
        </defs>

        <rect width="1040" height="680" fill="#f5f5f5"/>

        <!-- Solid clockwise ring: five arcs on the same r=240 station circle. -->
        <path class="ring" d="M 600.000 113.726 A 240 240 0 0 1 729.522 222.951" marker-end="url(#lore-consolidation-arrow)"/>
        <path class="ring" d="M 757.285 304.000 A 240 240 0 0 1 712.718 483.038" marker-end="url(#lore-consolidation-arrow)"/>
        <path class="ring" d="M 606.163 564.000 A 240 240 0 0 1 434.958 564.428" marker-end="url(#lore-consolidation-arrow)"/>
        <path class="ring" d="M 328.000 484.000 A 240 240 0 0 1 282.538 305.187" marker-end="url(#lore-consolidation-arrow)"/>
        <path class="ring" d="M 309.895 224.000 A 240 240 0 0 1 438.870 114.129" marker-end="url(#lore-consolidation-arrow)"/>

        <!-- Dashed write-backs: each station's inner edge to 6px before the record. -->
        <path class="spoke" d="M 520.000 140.000 L 520.000 282.000" marker-end="url(#lore-consolidation-arrow-soft)"/>
        <path class="spoke" d="M 668.000 289.994 L 625.706 305.654" marker-end="url(#lore-consolidation-arrow-soft)"/>
        <path class="spoke" d="M 630.938 484.000 L 561.307 396.854" marker-end="url(#lore-consolidation-arrow-soft)"/>
        <path class="spoke" d="M 409.062 484.000 L 478.693 396.854" marker-end="url(#lore-consolidation-arrow-soft)"/>
        <path class="spoke" d="M 372.000 289.994 L 414.294 305.654" marker-end="url(#lore-consolidation-arrow-soft)"/>

        <!-- Two write-back labels, masked, 8px clear of their spokes. -->
        <rect x="528" y="200" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="209" class="arrow-label">ACCRUED</text>
        <rect x="609" y="434" width="50" height="12" rx="2" fill="#f5f5f5"/>
        <text x="634" y="443" class="arrow-label">DECLARED</text>

        <!-- S0 · session capture -->
        <rect class="station" x="440" y="60" width="160" height="80" rx="6"/>
        <text x="520" y="99" class="node-name">Session capture</text>
        <text x="520" y="117" class="sublabel">what accrued</text>

        <!-- S1 · nightly pass -->
        <rect class="station" x="668" y="224" width="160" height="80" rx="6"/>
        <text x="748" y="263" class="node-name">Nightly pass</text>
        <text x="748" y="281" class="sublabel">ranks, decides</text>

        <!-- S2 · the declared invariants — the accent, from §The design choice -->
        <rect class="station focal" x="580" y="484" width="160" height="80" rx="6"/>
        <text x="660" y="523" class="node-name focal-name">Invariants</text>
        <text x="660" y="541" class="sublabel">declared, then checked</text>

        <!-- S3 · leaves -->
        <rect class="station" x="300" y="484" width="160" height="80" rx="6"/>
        <text x="380" y="523" class="node-name">Leaves</text>
        <text x="380" y="541" class="sublabel">kept, merged, faded</text>

        <!-- S4 · next session's context -->
        <rect class="station" x="212" y="224" width="160" height="80" rx="6"/>
        <text x="292" y="263" class="node-name">Next session</text>
        <text x="292" y="281" class="sublabel">reads the record</text>

        <!-- The one accumulated state. -->
        <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
        <text x="520" y="336" class="hub-name">The record</text>
        <text x="520" y="358" class="hub-sub">one pass a night, unwatched</text>

        <!-- Legend, outside the diagram area. -->
        <line x1="40" y1="616" x2="1000" y2="616" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="640" class="legend-eyebrow">LEGEND</text>
        <line x1="112" y1="636" x2="140" y2="636" stroke="#4f5d75" stroke-width="1.2"/>
        <polygon points="140,632.5 148,636 140,639.5" fill="#4f5d75"/>
        <text x="154" y="639" class="legend-label">one pass, clockwise</text>
        <line x1="300" y1="636" x2="328" y2="636" stroke="#5a6580" stroke-width="1" stroke-dasharray="5 4"/>
        <polygon points="328,632.5 336,636 328,639.5" fill="#5a6580"/>
        <text x="342" y="639" class="legend-label">written back into the record</text>
        <rect x="556" y="630" width="22" height="12" rx="3" fill="#2d3142"/>
        <text x="586" y="639" class="legend-label">the record: everything the pass keeps</text>
      </svg>
