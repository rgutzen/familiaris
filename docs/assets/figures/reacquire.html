<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Does this file go off-site?</title>
  <!-- 06-system: font source is system; no font link is ever emitted. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · storage</p>
    <h1>Does this file go off-site?</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reacquire-title reacquire-desc">
        <title id="reacquire-title">Does this file go off-site?</title>
        <desc id="reacquire-desc">Flowchart: the question is whether the file can be re-acquired from the internet. If yes it stays local, on the archive disk and the rotation disk, two copies. If no it also goes to the off-site store, three copies.</desc>
        <defs>
          <pattern id="reacquire-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="reacquire-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="reacquire-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#reacquire-dots)" opacity="0.55"/>
        <line x1="480" y1="80" x2="480" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reacquire-arrow)"/>
        <line x1="610" y1="160" x2="720" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reacquire-arrow)"/>
        <line x1="480" y1="208" x2="480" y2="248" stroke="#bf4520" stroke-width="1.4" marker-end="url(#reacquire-arrow-accent)"/>
        <rect x="649.0" y="143" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="665" y="152" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="500.0" y="223" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="232" fill="#bf4520" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="400" y="32" width="160" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="400" y="32" width="160" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="480" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a file to keep</text>
        <text x="480" y="74" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">which copies?</text>
        <polygon points="480,112 610,160 480,208 350,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Can I re-acquire this</text>
        <text x="480" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">from the internet?</text>
        <rect x="720" y="116" width="200" height="88" rx="20" fill="#f5f5f5"/>
        <rect x="720" y="116" width="200" height="88" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="820" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">stays local</text>
        <text x="820" y="158" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">archive disk + rotation disk</text>
        <text x="820" y="174" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">courses · books · papers</text>
        <text x="820" y="188" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">software · ISOs · videos</text>
        <rect x="380" y="248" width="200" height="88" rx="20" fill="#f5f5f5"/>
        <rect x="380" y="248" width="200" height="88" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">off-site as well</text>
        <text x="480" y="290" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ off-site store · 3 copies</text>
        <text x="480" y="306" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">photos · scans · own outputs</text>
        <text x="480" y="320" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">correspondence · notes</text>
        <line x1="40" y1="356" x2="920" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="372" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="388" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="397" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Start / end (oval)</text>
        <rect x="208" y="388" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="397" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Decision (diamond)</text>
        <rect x="376" y="388" width="14" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="398" y="397" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Goes off-site</text>
        <line x1="544" y1="394" x2="572" y2="394" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reacquire-arrow)"/>
        <text x="580" y="397" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Stays local</text>
        <line x1="644" y1="394" x2="672" y2="394" stroke="#bf4520" stroke-width="1.4" marker-end="url(#reacquire-arrow-accent)"/>
        <text x="680" y="397" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Off-site path</text>

      </svg>
    </div>
  </div>
</body>
</html>
