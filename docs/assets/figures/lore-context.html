<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A session in and out</title>
  <!-- 06-system: font source is system; no font link is ever emitted. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence &middot; context</p>
    <h1>A session in and out</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lore-context-title lore-context-desc">
        <title id="lore-context-title">A session in and out</title>
        <desc id="lore-context-desc">Sequence of one session through the clew: it is handed the always-on entry point at one index level, asks the retrieval tool over the knowledge tree and the journal for everything else, and engine/context scores the corpus and measures what a pointer is worth before that budget is set.</desc>
        <defs>
          <pattern id="lore-context-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="lore-context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lore-context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lore-context-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="lore-context-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#lore-context-dots)" opacity="0.55"/>

        <!-- lifelines: session 112 · entry point 288 · retrieval 464 · tree 640 · engine/context 816 -->
        <line x1="112" y1="128" x2="112" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="288" y1="128" x2="288" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="464" y1="128" x2="464" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="640" y1="128" x2="640" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="816" y1="128" x2="816" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- activation bars: entry point 288-336 · retrieval 396-532 · tree 444-488 -->
        <rect x="284" y="292" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="460" y="396" width="8" height="136" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="636" y="444" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- M1: engine/context scores the staged corpus (self) -->
        <path d="M816 168 H848 V200 H816" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-context-arrow)"/>
        <!-- M2: the measured pointer value sets the always-on budget (accent: the design choice) -->
        <line x1="816" y1="240" x2="288" y2="240" stroke="#bf4520" stroke-width="1.4" marker-end="url(#lore-context-arrow-accent)"/>
        <!-- M3: session is handed the always-on budget -->
        <line x1="112" y1="288" x2="284" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-context-arrow)"/>
        <!-- M4: return -- the entry point and what it points to -->
        <line x1="284" y1="336" x2="112" y2="336" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lore-context-arrow)"/>
        <!-- M5: everything else comes by asking -->
        <line x1="112" y1="392" x2="460" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-context-arrow)"/>
        <!-- M6: the tool call over tree and journal -->
        <line x1="468" y1="440" x2="636" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lore-context-arrow)"/>
        <!-- M7: rows back -->
        <line x1="636" y1="488" x2="468" y2="488" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lore-context-arrow)"/>
        <!-- M8: the content the session now holds -->
        <line x1="460" y1="536" x2="112" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lore-context-arrow)"/>

        <!-- message labels, each on its own mask -->
        <rect x="856" y="176" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="860" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">CORPUS SCORED</text>

        <rect x="490" y="220" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="230" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MEASURED, NOT ASSUMED</text>

        <rect x="164" y="268" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="198" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOAD BUDGET</text>

        <rect x="160" y="316" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="198" y="326" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENTRY + INDEX</text>

        <rect x="344" y="372" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

        <rect x="532" y="420" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

        <rect x="534" y="468" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="478" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ROWS</text>

        <rect x="348" y="516" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="526" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONTENT</text>

        <!-- actors: 144 x 56, centres 112 / 288 / 464 / 640 / 816 -->
        <rect x="40" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
        <text x="112" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Session</text>
        <text x="112" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in, then ask</text>

        <rect x="216" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="224" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="244" y="89" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ON</text>
        <text x="288" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Entry point</text>
        <text x="288" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one index level</text>

        <rect x="392" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="400" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="420" y="89" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="464" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Retrieval</text>
        <text x="464" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a tool, not prose</text>

        <rect x="568" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="576" y="80" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="600" y="89" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="640" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tree + journal</text>
        <text x="640" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">knowledge · journal</text>

        <!-- the focal actor: the measurement itself -->
        <rect x="744" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="744" y="72" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="752" y="80" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="778" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MEASURE</text>
        <text x="816" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">engine/context</text>
        <text x="816" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">route cost · pointer</text>
      </svg>
    </div>
  </div>
</body>
</html>
